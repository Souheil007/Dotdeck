services:
  postgres:
    image: postgres:16-alpine
    container_name: dotdeck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotdeck
      POSTGRES_PASSWORD: dotdeck_dev_password
      POSTGRES_DB: dotdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotdeck -d dotdeck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dotdeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotdeck-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://dotdeck:dotdeck_dev_password@postgres:5432/dotdeck?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "development"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dotdeck-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_WS_URL: "ws://localhost:8080/ws"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
